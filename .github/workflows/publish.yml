name: Publish to npm

# Publishes packages/wallhammer-web when a GitHub release is published. The release tag must be `v<version>` of
# packages/wallhammer-web/package.json; the version is set by hand before the release (it is never bumped here).
# Authentication is npm trusted publishing (OIDC): no token and no secret. On npmjs.com the package names this
# repository and this workflow file (publish.yml) as its trusted publisher; the job needs `id-token: write`.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/wallhammer-web/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match the package version $VERSION (expected v$VERSION)"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - name: Pack
        working-directory: packages/wallhammer-web
        # pnpm, not npm: only pnpm applies publishConfig.exports (dist/ instead of src/). prepack builds dist/.
        run: pnpm pack --out package.tgz

      - name: Publish
        working-directory: packages/wallhammer-web
        run: |
          # npm publishes the tarball pnpm packed and signs in through OIDC.
          # A prerelease version (1.2.3-beta.1) goes under the `beta` dist-tag, so `latest` stays the stable one.
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) npm publish package.tgz --access public --tag beta ;;
            *)   npm publish package.tgz --access public ;;
          esac
