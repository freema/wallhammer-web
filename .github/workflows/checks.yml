name: Checks

# The same checks as in the dev container (README.md, section "Checks"), on every push to main and every pull request.
# Other workflows call it before they publish (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          # The version of Dockerfile.dev.
          node-version: 22.23.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:layers
      - run: pnpm check:layers:test
      - run: pnpm test:golden
      - run: pnpm check:docs
      - run: pnpm check:mesh
      - run: pnpm check:motion
      - run: pnpm check:walk
      - run: pnpm check:follow
      - run: pnpm check:pack
