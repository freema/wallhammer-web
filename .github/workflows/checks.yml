name: Checks

# The same checks as in the dev container (README.md, section "Checks"), on every push to main and every pull request.
# Other workflows call it before they publish (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The version of Dockerfile.dev.
          node-version: 22.23.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:layers
      - run: pnpm check:layers:test
      - run: pnpm test:golden
      - run: pnpm check:docs
      - run: pnpm check:mesh
      - run: pnpm check:motion
      - run: pnpm check:walk
      - run: pnpm check:follow
      - run: pnpm test:marks
      - run: pnpm check:pack
      # The planet example's own headless check (generator, flight, streaming, movie); about 10 s.
      - run: pnpm --filter wallhammer-example-planet verify

  # The shader check (README.md, section "Shader check"): every program the example pages make is compiled and linked
  # in headless Chromium on the software renderer. It runs as on a developer's machine, through docker-compose.yml:
  # `shaders` builds its image and the dev image, starts `dev` (which installs the dependencies and serves the
  # examples) and waits until it is healthy. A job of its own, so the other checks do not wait for it; about two
  # minutes of pages after the images and the install. `--variants` adds the pages and hashes of
  # tools/shot/shader-variants.mjs, whose programs the default pages do not make.
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The containers run as uid 1000 and pnpm sets the mode of the package's bin file in the mounted tree, which only
      # the file's owner may do; the runner checks the tree out under another uid.
      - run: sudo chown -R 1000:1000 .
      - run: docker compose run --rm shaders --variants
      - if: failure()
        run: docker compose logs --tail 200 dev
      - if: always()
        run: docker compose down
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .
