name: Pages

# The live demos: every example built to static files (pnpm build:examples, tools/pages/build.ts) and deployed to
# GitHub Pages at https://freema.github.io/wallhammer-web/<name>/, with the list of the examples at the root.
# Runs on a push to main that touches what the pages are built from, and by hand (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer run waits, a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The version of Dockerfile.dev.
          node-version: 22.23.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build:examples
        env:
          # The path of the site: "/wallhammer-web" on freema.github.io, "" with a custom domain.
          WH_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
