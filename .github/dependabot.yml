version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates of all packages in one pull request; major updates stay separate.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
